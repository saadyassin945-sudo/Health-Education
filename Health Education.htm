<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Health Education</title>
    <style>
        :root {
            --bg1: #0a0e1a; --bg2: #141e33; --primary: #00d4ff; --primary-dark: #0099cc;
            --accent: #facc15; --danger: #f87171; --success: #34d399;
            --card-bg: rgba(255, 255, 255, 0.04); --card-border: rgba(255, 255, 255, 0.08);
            --text: #e8edf5; --muted: #94a3b8;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5); --glow: 0 0 30px rgba(0, 212, 255, 0.06);
            --radius: 16px; --header-bg: rgba(255, 255, 255, 0.03); --header-border: rgba(255, 255, 255, 0.04);
            --footer-border: rgba(255, 255, 255, 0.03); --table-header-bg: rgba(0, 212, 255, 0.08);
            --card-title-bg: rgba(0, 212, 255, 0.06); --highlight-bg: #facc15; --highlight-text: #0f172a;
        }
        [data-theme="light"] {
            --bg1: #f0f4f8; --bg2: #e2e8f0; --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.1); --text: #0f172a; --muted: #475569;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08); --glow: 0 0 30px rgba(0, 212, 255, 0.02);
            --header-bg: rgba(255, 255, 255, 0.7); --header-border: rgba(0, 0, 0, 0.04);
            --footer-border: rgba(0, 0, 0, 0.04); --table-header-bg: rgba(0, 212, 255, 0.12);
            --card-title-bg: rgba(0, 212, 255, 0.08);
        }
        .highlight-text { background-color: var(--highlight-bg); color: var(--highlight-text); padding: 0 4px; border-radius: 4px; font-weight: bold; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), #0f1a2b);
            min-height: 100vh; color: var(--text); padding: 16px 8px;
            display: flex; justify-content: center; align-items: flex-start;
            transition: background 0.4s ease;
        }
        .app { max-width: 1100px; width: 100%; }
        .header { text-align: center; margin-bottom: 20px; padding: 16px 16px; background: var(--header-bg); border-radius: 20px; border: 1px solid var(--header-border); backdrop-filter: blur(4px); }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .header h1 { font-size: 1.8rem; font-weight: 800; color: #fff; text-shadow: 0 4px 25px rgba(0, 212, 255, 0.15); transition: color 0.3s ease; }
        [data-theme="light"] .header h1 { color: #0f172a; text-shadow: none; }
        .header h1 .highlight { background: linear-gradient(135deg, var(--primary), #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .sub { color: var(--primary); font-weight: 600; letter-spacing: 1.5px; font-size: 0.8rem; margin-top: 2px; }
        .header .creator { color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
        .header .creator .name { color: var(--text); font-weight: 700; }
        .theme-toggle { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 50%; width: 42px; height: 42px; font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; color: var(--text); }
        .theme-toggle:hover { border-color: var(--primary); background: rgba(0, 212, 255, 0.08); transform: scale(1.05); }
        [data-theme="light"] .theme-toggle { background: rgba(0, 0, 0, 0.04); border-color: rgba(0, 0, 0, 0.06); }
        .tabs-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; justify-content: center; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 30px; padding: 8px 14px; font-size: 0.7rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.2s ease; text-align: center; line-height: 1.3; }
        .tab-btn:hover { border-color: var(--primary); color: var(--text); }
        .tab-btn.active { border-color: var(--primary); background: rgba(0, 212, 255, 0.08); color: var(--primary); }
        .tab-btn .en { display: block; font-size: 0.7rem; }
        .tab-btn .ar { display: block; font-size: 0.55rem; opacity: 0.7; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: var(--radius); box-shadow: var(--shadow), var(--glow); padding: 18px 14px; margin-bottom: 16px; transition: background 0.3s ease, border 0.3s ease; display: none; }
        .card.active { display: block; }
        .card h2 { font-size: 1.3rem; color: var(--text); border-right: 4px solid var(--primary); padding-right: 12px; margin-bottom: 16px; font-weight: 700; }
        .slide-container { position: relative; min-height: 300px; }
        .slide { display: none; animation: fadeSlide 0.3s ease; }
        .slide.active { display: block; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateX(15px); } to { opacity: 1; transform: translateX(0); } }
        .slide-progress { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.8rem; color: var(--muted); }
        .slide-progress .bar { flex: 1; height: 4px; background: rgba(255, 255, 255, 0.06); border-radius: 10px; margin: 0 12px; overflow: hidden; }
        .slide-progress .bar .fill { height: 100%; background: linear-gradient(90deg, var(--primary), #818cf8); border-radius: 10px; transition: width 0.3s ease; }
        .slide-progress .count { font-weight: 600; white-space: nowrap; }
        .slide-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }
        .slide-nav .btn-nav { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 30px; padding: 10px 20px; font-size: 0.9rem; font-weight: 600; color: var(--text); cursor: pointer; transition: all 0.2s ease; min-width: 80px; text-align: center; }
        .slide-nav .btn-nav:hover:not(:disabled) { background: rgba(0, 212, 255, 0.08); border-color: var(--primary); }
        .slide-nav .btn-nav:disabled { opacity: 0.3; cursor: default; }
        .slide-nav .btn-nav.primary { background: var(--primary); color: #0a0e1a; border-color: var(--primary); }
        .slide-nav .btn-nav.primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }
        [data-theme="light"] .slide-nav .btn-nav { background: rgba(0, 0, 0, 0.02); border-color: rgba(0, 0, 0, 0.06); }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 8px; }
        .topic-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px 14px 12px; transition: border-color 0.2s ease; display: flex; flex-direction: column; }
        .topic-card:hover { border-color: var(--primary); }
        .topic-card .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--card-title-bg); }
        .topic-card .card-title { font-weight: 700; font-size: 0.95rem; color: var(--primary); line-height: 1.4; flex: 1; }
        .topic-card .card-title-ar { color: var(--muted); font-weight: 400; display: none; }
        .topic-card .card-title-ar.show { display: inline; }
        .topic-card .card-title-en { display: inline; }
        .topic-card .card-title-en.hidden { display: none; }
        .topic-card .translate-btn { background: rgba(0, 212, 255, 0.08); border: 1px solid var(--card-border); border-radius: 20px; padding: 3px 12px; font-size: 0.6rem; color: var(--primary); cursor: pointer; transition: all 0.2s ease; white-space: nowrap; flex-shrink: 0; margin-right: 8px; }
        .topic-card .translate-btn:hover { background: rgba(0, 212, 255, 0.18); border-color: var(--primary); }
        .topic-card .translate-btn.active { background: rgba(0, 212, 255, 0.18); border-color: var(--primary); }
        .topic-card .card-items { list-style: none; padding: 0; margin: 0; flex: 1; }
        .topic-card .card-items li { padding: 4px 0; line-height: 1.6; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        [data-theme="light"] .topic-card .card-items li { border-bottom-color: rgba(0, 0, 0, 0.04); }
        .topic-card .card-items li:last-child { border-bottom: none; }
        .topic-card .item-en { font-weight: 600; color: var(--text); font-size: 0.9rem; line-height: 1.6; display: block; text-align: left; direction: ltr; }
        .topic-card .item-ar { color: var(--muted); font-size: 0.82rem; line-height: 1.6; text-align: right; direction: rtl; display: none; margin-top: 2px; padding-right: 8px; border-right: 2px solid rgba(0, 212, 255, 0.2); }
        .topic-card .item-ar.show { display: block; }
        .topic-card .card-items.numbered { counter-reset: item-counter; }
        .topic-card .card-items.numbered li { padding-right: 28px; position: relative; counter-increment: item-counter; }
        .topic-card .card-items.numbered li::before { content: counter(item-counter) "-"; position: absolute; right: 2px; color: var(--primary); font-weight: 700; font-size: 0.85rem; }
        .info-table-wrap { overflow-x: auto; margin: 12px 0; border-radius: 10px; border: 1px solid var(--card-border); grid-column: 1 / -1; }
        .info-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 500px; }
        .info-table th { background: var(--table-header-bg); color: var(--primary); padding: 8px 6px; text-align: center; border-bottom: 2px solid var(--primary); font-weight: 700; }
        .info-table td { padding: 8px 6px; border-bottom: 1px solid var(--card-border); vertical-align: top; line-height: 1.5; }
        .info-table tr:last-child td { border-bottom: none; }
        .info-table .ar-text { border-right: none; padding-right: 0; margin-top: 2px; font-size: 0.78rem; display: block; color: var(--muted); }
        .info-table .en-text { font-size: 0.85rem; }
        @media (max-width: 600px) { .cards-grid { grid-template-columns: 1fr; } .info-table { font-size: 0.72rem; min-width: 350px; } .topic-card .card-title { font-size: 0.85rem; } }
        .footer-credit { text-align: center; color: rgba(255, 255, 255, 0.12); font-size: 0.7rem; margin-top: 24px; padding: 10px 0; border-top: 1px solid var(--footer-border); }
        [data-theme="light"] .footer-credit { color: rgba(0, 0, 0, 0.2); }
        .footer-credit .name { color: var(--primary); font-weight: 600; }
        @media (max-width: 768px) { body { padding: 8px 4px; } .header h1 { font-size: 1.4rem; } .tab-btn { padding: 6px 10px; font-size: 0.6rem; } .card { padding: 14px 10px; } .card h2 { font-size: 1.1rem; } }
        .topic-card.full-width { grid-column: 1 / -1; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="header-top">
                <div>
                    <h1><span class="highlight">Health Education</span></h1>
                    <div class="sub"></div>
                    <div class="creator">Created by <span class="name">MR. YASSIN THARWAT</span></div>
                </div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="تبديل الوضع">☀</button>
            </div>
        </div>
        <div class="tabs-wrap" id="tabsContainer"></div>
        <div id="sectionsContainer"></div>
        <div class="footer-credit">Created by <span class="name">MR. YASSIN THARWAT</span></div>
    </div>

    <script>
        let currentTheme = localStorage.getItem('theme') || 'dark';
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeToggle').textContent = theme === 'light' ? '☾' : '☀';
            localStorage.setItem('theme', theme);
            currentTheme = theme;
        }
        function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

        let slideState = {};
        function initSlideState(partId, totalSlides) { slideState[partId] = { current: 0, total: totalSlides }; }
        function renderSlide(partId, containerId) {
            const state = slideState[partId];
            if (!state) return;
            const container = document.getElementById(containerId);
            if (!container) return;
            const slides = container.querySelectorAll('.slide');
            slides.forEach((s, i) => s.classList.toggle('active', i === state.current));
            const progressBar = container.querySelector('.slide-progress .fill');
            const countSpan = container.querySelector('.slide-progress .count');
            if (progressBar) progressBar.style.width = ((state.current + 1) / state.total * 100) + '%';
            if (countSpan) countSpan.textContent = `${state.current + 1} / ${state.total}`;
            const prevBtn = container.querySelector('.btn-nav.prev');
            const nextBtn = container.querySelector('.btn-nav.next');
            if (prevBtn) prevBtn.disabled = state.current === 0;
            if (nextBtn) nextBtn.disabled = state.current === state.total - 1;
        }
        function goToSlide(partId, containerId, index) {
            const state = slideState[partId];
            if (!state) return;
            if (index < 0) index = 0;
            if (index >= state.total) index = state.total - 1;
            state.current = index;
            renderSlide(partId, containerId);
        }

        function createSlideHTML(title, cardsHTML) {
            return `<div class="slide"><h3 style="font-size:1.1rem; color:var(--primary); margin-bottom:12px; border-right:3px solid var(--primary); padding-right:10px;">${title}</h3><div class="cards-grid">${cardsHTML}</div></div>`;
        }
        function card(title, items, arTitle = '') {
            const cardId = 'c' + Math.random().toString(36).substr(2, 8);
            const itemsHTML = items.map((item) => {
                const en = item.en || item;
                const ar = item.ar || '';
                return `<li><span class="item-en">${en}</span><span class="item-ar">${ar}</span></li>`;
            }).join('');
            const listClass = items.some(i => i.en && i.en.match(/^\d/)) ? 'card-items numbered' : 'card-items simple';
            return `<div class="topic-card" data-card="${cardId}"><div class="card-header"><span class="card-title"><span class="card-title-en">${title}</span><span class="card-title-ar" id="${cardId}-title-ar">${arTitle}</span></span><button class="translate-btn" data-card="${cardId}" onclick="toggleCardTranslation('${cardId}')">ترجمة</button></div><ul class="${listClass}">${itemsHTML}</ul></div>`;
        }
        function tableCard(title, tableHTML, arTitle = '') {
            return `<div class="topic-card full-width"><div class="card-header"><span class="card-title"><span class="card-title-en">${title}</span><span class="card-title-ar" style="display:block;">${arTitle}</span></span></div><div class="info-table-wrap">${tableHTML}</div></div>`;
        }
        function cell(en, ar) { return `<span class="en-text">${en}</span><span class="ar-text">${ar}</span>`; }
        function toggleCardTranslation(cardId) {
            const card = document.querySelector(`.topic-card[data-card="${cardId}"]`);
            if (!card) return;
            const arItems = card.querySelectorAll('.item-ar');
            const titleAr = document.getElementById(`${cardId}-title-ar`);
            const titleEn = card.querySelector('.card-title-en');
            const btn = card.querySelector('.translate-btn');
            const isVisible = arItems.length > 0 && arItems[0].classList.contains('show');
            arItems.forEach(el => el.classList.toggle('show'));
            if (titleAr) { titleAr.classList.toggle('show'); if (titleEn) titleEn.classList.toggle('hidden'); }
            if (btn) { btn.textContent = isVisible ? 'ترجمة' : 'إخفاء'; btn.classList.toggle('active'); }
        }

        // ============================================================
        //  DATA: HEALTH EDUCATION
        // ============================================================
        const healthEdData = {
            titleEn: 'Lecture 1',
            titleAr: 'المحاضرة الأولى',
            slides: [
                // ---------- SLIDE 1 ----------
                {
                    title: 'Introduction & Definitions · المقدمة والتعريفات',
                    cards: [
                        card('Introduction · المقدمة', [
                            { en: 'Health education is an <span class="highlight-text">essential component of nursing and public health</span> that helps individuals, families, and communities improve their health knowledge, attitudes, and practices.', ar: 'التثقيف الصحي هو <span class="highlight-text">مكون أساسي في التمريض والصحة العامة</span> يساعد الأفراد والأسر والمجتمعات على تحسين معارفهم ومواقفهم وممارساتهم الصحية.' },
                            { en: 'It makes people <span class="highlight-text">change their ill life habits and behaviors</span> and motivate them towards forming healthy habits.', ar: 'يجعل الناس <span class="highlight-text">يغيّرون عاداتهم وأنماط حياتهم السيئة</span> ويحفزهم لتكوين عادات صحية.' }
                        ], 'المقدمة:'),
                        card('Definition of Health Education · تعريف التثقيف الصحي', [
                            { en: 'A <span class="highlight-text">planned process of teaching and learning</span> that helps people acquire knowledge, develop positive attitudes, and adopt healthy behaviors.', ar: '<span class="highlight-text">عملية تعليم وتعلم مخططة</span> تساعد الناس على اكتساب المعرفة وتطوير مواقف إيجابية وتبني سلوكيات صحية.' },
                            { en: 'It is <span class="highlight-text">not simply giving information</span>; rather, it aims to encourage people to make <span class="highlight-text">voluntary decisions</span> that improve their health.', ar: '<span class="highlight-text">ليس مجرد إعطاء معلومات</span>؛ بل يهدف إلى تشجيع الناس على اتخاذ <span class="highlight-text">قرارات طوعية</span> تحسن صحتهم.' }
                        ], 'تعريف التثقيف الصحي:'),
                        card('Health Education Empowers Individuals · التثقيف الصحي يمكّن الأفراد من', [
                            { en: '1. <span class="highlight-text">Understand their health status</span>.', ar: '1. <span class="highlight-text">فهم حالتهم الصحية</span>.' },
                            { en: '2. <span class="highlight-text">Recognize factors</span> that affect their health.', ar: '2. <span class="highlight-text">التعرف على العوامل</span> التي تؤثر على صحتهم.' },
                            { en: '3. <span class="highlight-text">Prevent diseases</span> and complications.', ar: '3. <span class="highlight-text">الوقاية من الأمراض</span> والمضاعفات.' },
                            { en: '4. Adopt <span class="highlight-text">healthy lifestyles</span>.', ar: '4. تبني <span class="highlight-text">أنماط حياة صحية</span>.' },
                            { en: '5. Make <span class="highlight-text">informed health decisions</span>.', ar: '5. اتخاذ <span class="highlight-text">قرارات صحية مستنيرة</span>.' }
                        ], 'التمكين:'),
                        card('Patient Education · تعليم المريض', [
                            { en: 'A term for education in <span class="highlight-text">hospital and clinic settings</span> linked to following treatment procedures, medication, home care, and rehabilitation procedures.', ar: 'مصطلح يشير إلى التعليم في <span class="highlight-text">بيئات المستشفيات والعيادات</span> المرتبط باتباع إجراءات العلاج والأدوية والرعاية المنزلية وإجراءات التأهيل.' }
                        ], 'تعليم المريض:')
                    ]
                },
                // ---------- SLIDE 2 ----------
                {
                    title: 'Importance of Health Education · أهمية التثقيف الصحي',
                    cards: [
                        card('1. Promotes Healthy Living · تعزيز الحياة الصحية', [
                            { en: 'Encourages healthy habits such as <span class="highlight-text">balanced nutrition, exercise, personal hygiene, and adequate sleep</span>.', ar: 'يشجع العادات الصحية مثل <span class="highlight-text">التغذية المتوازنة والرياضة والنظافة الشخصية والنوم الكافي</span>.' },
                            { en: 'Example: Teaching school children the importance of <span class="highlight-text">hand washing</span> can reduce infectious diseases.', ar: 'مثال: تعليم أطفال المدارس أهمية <span class="highlight-text">غسل اليدين</span> يمكن أن يقلل من الأمراض المعدية.' }
                        ], '1. تعزيز الحياة الصحية:'),
                        card('2. Prevents Disease · الوقاية من الأمراض', [
                            { en: 'Helps people understand <span class="highlight-text">risk factors and preventive measures</span>.', ar: 'يساعد الناس على فهم <span class="highlight-text">عوامل الخطر والتدابير الوقائية</span>.' },
                            { en: 'Example: Educating adults about <span class="highlight-text">hypertension risk factors</span> may prevent cardiovascular diseases.', ar: 'مثال: تثقيف البالغين حول <span class="highlight-text">عوامل خطر ارتفاع ضغط الدم</span> قد يمنع أمراض القلب والأوعية الدموية.' }
                        ], '2. الوقاية من الأمراض:'),
                        card('3. Improves Quality of Life · تحسين جودة الحياة', [
                            { en: 'People who understand health issues are better able to maintain <span class="highlight-text">physical, mental, and social wellbeing</span>.', ar: 'الأشخاص الذين يفهمون القضايا الصحية يكونون أقدر على الحفاظ على <span class="highlight-text">الرفاهية الجسدية والعقلية والاجتماعية</span>.' }
                        ], '3. تحسين جودة الحياة:'),
                        card('4. Encourages Early Detection · تشجيع الكشف المبكر', [
                            { en: 'Increases awareness about <span class="highlight-text">health screening and regular checkups</span>.', ar: 'يزيد الوعي حول <span class="highlight-text">الفحص الصحي والفحوصات الدورية</span>.' },
                            { en: 'Example: Health education about <span class="highlight-text">breast cancer</span> encourages women to perform <span class="highlight-text">breast self-examination</span>.', ar: 'مثال: التثقيف الصحي حول <span class="highlight-text">سرطان الثدي</span> يشجع النساء على إجراء <span class="highlight-text">الفحص الذاتي للثدي</span>.' }
                        ], '4. الكشف المبكر:'),
                        card('5. Reduces Healthcare Costs · تقليل تكاليف الرعاية الصحية', [
                            { en: '<span class="highlight-text">Prevention is less expensive than treatment</span>.', ar: '<span class="highlight-text">الوقاية أقل تكلفة من العلاج</span>.' },
                            { en: 'Healthy behaviors reduce <span class="highlight-text">hospital admissions and medical expenses</span>.', ar: 'السلوكيات الصحية تقلل من <span class="highlight-text">دخول المستشفيات والنفقات الطبية</span>.' }
                        ], '5. تقليل التكاليف:')
                    ]
                },
                // ---------- SLIDE 3 ----------
                {
                    title: 'Objectives of Health Education · أهداف التثقيف الصحي',
                    cards: [
                        card('General Objectives · الأهداف العامة', [
                            { en: 'To make <span class="highlight-text">health and quality respected</span> by the community.', ar: 'جعل <span class="highlight-text">الصحة والجودة محترمة</span> من قبل المجتمع.' },
                            { en: 'To encourage behavior that <span class="highlight-text">promotes and maintains health</span>.', ar: 'تشجيع السلوك الذي <span class="highlight-text">يعزز ويحافظ على الصحة</span>.' },

        const slidesData = { healthEd: healthEdData };
        const sectionOrder = ['healthEd'];

        function renderSlideContent(slide) {
            if (slide.cards && Array.isArray(slide.cards)) {
                return createSlideHTML(slide.title, slide.cards.join(''));
            }
            return createSlideHTML(slide.title, '');
        }
        function buildApp() {
            const tabsContainer = document.getElementById('tabsContainer');
            const sectionsContainer = document.getElementById('sectionsContainer');
            sectionOrder.forEach((secId) => {
                const sec = slidesData[secId];
                if (!sec) return;
                const tab = document.createElement('button');
                tab.className = 'tab-btn active';
                tab.innerHTML = `<span class="en">${sec.titleEn}</span><span class="ar">${sec.titleAr}</span>`;
                tabsContainer.appendChild(tab);
                const cardEl = document.createElement('div');
                cardEl.className = 'card active';
                cardEl.id = `section-${secId}`;
                const slidesHTML = sec.slides.map(s => renderSlideContent(s)).join('');
                const totalSlides = sec.slides.length;
                cardEl.innerHTML = `
                    <h2>${sec.titleEn} · ${sec.titleAr}</h2>
                    <div class="slide-container" id="slideContainer-${secId}">
                        <div class="slide-progress">
                            <span style="font-weight:600;">التقدم</span>
                            <div class="bar"><div class="fill" style="width:0%;"></div></div>
                            <span class="count">1 / ${totalSlides}</span>
                        </div>
                        ${slidesHTML}
                        <div class="slide-nav">
                            <button class="btn-nav prev" onclick="goToSlide('${secId}', 'slideContainer-${secId}', slideState['${secId}'].current - 1)">السابق</button>
                            <button class="btn-nav next primary" onclick="goToSlide('${secId}', 'slideContainer-${secId}', slideState['${secId}'].current + 1)">التالي</button>
                        </div>
                    </div>`;
                sectionsContainer.appendChild(cardEl);
                initSlideState(secId, totalSlides);
                setTimeout(() => renderSlide(secId, `slideContainer-${secId}`), 50);
            });
        }

        applyTheme(localStorage.getItem('theme') || 'dark');
        buildApp();

        window.goToSlide = goToSlide;
        window.slideState = slideState;
        window.toggleTheme = toggleTheme;
        window.toggleCardTranslation = toggleCardTranslation;
    </script>
</body>
</html>
