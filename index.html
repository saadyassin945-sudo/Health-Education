<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Health Education</title>
    <style>
        :root {
            --bg1: #0a0e1a; --bg2: #141e33; --primary: #00d4ff; --primary-dark: #0099cc;
            --accent: #facc15; --danger: #f87171; --success: #34d399;
            --card-bg: rgba(255, 255, 255, 0.04); --card-border: rgba(255, 255, 255, 0.08);
            --text: #e8edf5; --muted: #94a3b8;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5); --glow: 0 0 30px rgba(0, 212, 255, 0.06);
            --radius: 16px; --header-bg: rgba(255, 255, 255, 0.03); --header-border: rgba(255, 255, 255, 0.04);
            --footer-border: rgba(255, 255, 255, 0.03); --table-header-bg: rgba(0, 212, 255, 0.08);
            --card-title-bg: rgba(0, 212, 255, 0.06); --highlight-bg: #facc15; --highlight-text: #0f172a;
        }
        [data-theme="light"] {
            --bg1: #f0f4f8; --bg2: #e2e8f0; --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.1); --text: #0f172a; --muted: #475569;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08); --glow: 0 0 30px rgba(0, 212, 255, 0.02);
            --header-bg: rgba(255, 255, 255, 0.7); --header-border: rgba(0, 0, 0, 0.04);
            --footer-border: rgba(0, 0, 0, 0.04); --table-header-bg: rgba(0, 212, 255, 0.12);
            --card-title-bg: rgba(0, 212, 255, 0.08);
        }
        .highlight-text { background-color: var(--highlight-bg); color: var(--highlight-text); padding: 0 4px; border-radius: 4px; font-weight: bold; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), #0f1a2b);
            min-height: 100vh; color: var(--text); padding: 16px 8px;
            display: flex; justify-content: center; align-items: flex-start;
            transition: background 0.4s ease;
        }
        .app { max-width: 1100px; width: 100%; }
        .header { text-align: center; margin-bottom: 20px; padding: 16px 16px; background: var(--header-bg); border-radius: 20px; border: 1px solid var(--header-border); backdrop-filter: blur(4px); }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .header h1 { font-size: 1.8rem; font-weight: 800; color: #fff; text-shadow: 0 4px 25px rgba(0, 212, 255, 0.15); transition: color 0.3s ease; }
        [data-theme="light"] .header h1 { color: #0f172a; text-shadow: none; }
        .header h1 .highlight { background: linear-gradient(135deg, var(--primary), #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .sub { color: var(--primary); font-weight: 600; letter-spacing: 1.5px; font-size: 0.8rem; margin-top: 2px; }
        .header .creator { color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
        .header .creator .name { color: var(--text); font-weight: 700; }
        .theme-toggle { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 50%; width: 42px; height: 42px; font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; color: var(--text); }
        .theme-toggle:hover { border-color: var(--primary); background: rgba(0, 212, 255, 0.08); transform: scale(1.05); }
        [data-theme="light"] .theme-toggle { background: rgba(0, 0, 0, 0.04); border-color: rgba(0, 0, 0, 0.06); }
        .tabs-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; justify-content: center; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 30px; padding: 8px 14px; font-size: 0.7rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.2s ease; text-align: center; line-height: 1.3; }
        .tab-btn:hover { border-color: var(--primary); color: var(--text); }
        .tab-btn.active { border-color: var(--primary); background: rgba(0, 212, 255, 0.08); color: var(--primary); }
        .tab-btn .en { display: block; font-size: 0.7rem; }
        .tab-btn .ar { display: block; font-size: 0.55rem; opacity: 0.7; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: var(--radius); box-shadow: var(--shadow), var(--glow); padding: 18px 14px; margin-bottom: 16px; transition: background 0.3s ease, border 0.3s ease; display: none; }
        .card.active { display: block; }
        .card h2 { font-size: 1.3rem; color: var(--text); border-right: 4px solid var(--primary); padding-right: 12px; margin-bottom: 16px; font-weight: 700; }
        .slide-container { position: relative; min-height: 300px; }
        .slide { display: none; animation: fadeSlide 0.3s ease; }
        .slide.active { display: block; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateX(15px); } to { opacity: 1; transform: translateX(0); } }
        .slide-progress { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.8rem; color: var(--muted); }
        .slide-progress .bar { flex: 1; height: 4px; background: rgba(255, 255, 255, 0.06); border-radius: 10px; margin: 0 12px; overflow: hidden; }
        .slide-progress .bar .fill { height: 100%; background: linear-gradient(90deg, var(--primary), #818cf8); border-radius: 10px; transition: width 0.3s ease; }
        .slide-progress .count { font-weight: 600; white-space: nowrap; }
        .slide-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }
        .slide-nav .btn-nav { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 30px; padding: 10px 20px; font-size: 0.9rem; font-weight: 600; color: var(--text); cursor: pointer; transition: all 0.2s ease; min-width: 80px; text-align: center; }
        .slide-nav .btn-nav:hover:not(:disabled) { background: rgba(0, 212, 255, 0.08); border-color: var(--primary); }
        .slide-nav .btn-nav:disabled { opacity: 0.3; cursor: default; }
        .slide-nav .btn-nav.primary { background: var(--primary); color: #0a0e1a; border-color: var(--primary); }
        .slide-nav .btn-nav.primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }
        [data-theme="light"] .slide-nav .btn-nav { background: rgba(0, 0, 0, 0.02); border-color: rgba(0, 0, 0, 0.06); }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 8px; }
        .topic-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px 14px 12px; transition: border-color 0.2s ease; display: flex; flex-direction: column; }
        .topic-card:hover { border-color: var(--primary); }
        .topic-card .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--card-title-bg); }
        .topic-card .card-title { font-weight: 700; font-size: 0.95rem; color: var(--primary); line-height: 1.4; flex: 1; }
        .topic-card .card-title-ar { color: var(--muted); font-weight: 400; display: none; }
        .topic-card .card-title-ar.show { display: inline; }
        .topic-card .card-title-en { display: inline; }
        .topic-card .card-title-en.hidden { display: none; }
        .topic-card .translate-btn { background: rgba(0, 212, 255, 0.08); border: 1px solid var(--card-border); border-radius: 20px; padding: 3px 12px; font-size: 0.6rem; color: var(--primary); cursor: pointer; transition: all 0.2s ease; white-space: nowrap; flex-shrink: 0; margin-right: 8px; }
        .topic-card .translate-btn:hover { background: rgba(0, 212, 255, 0.18); border-color: var(--primary); }
        .topic-card .translate-btn.active { background: rgba(0, 212, 255, 0.18); border-color: var(--primary); }
        .topic-card .card-items { list-style: none; padding: 0; margin: 0; flex: 1; }
        .topic-card .card-items li { padding: 4px 0; line-height: 1.6; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        [data-theme="light"] .topic-card .card-items li { border-bottom-color: rgba(0, 0, 0, 0.04); }
        .topic-card .card-items li:last-child { border-bottom: none; }
        .topic-card .item-en {
            font-weight: 600; color: var(--text); font-size: 0.9rem; line-height: 1.6;
            display: block; text-align: left; direction: ltr;
            cursor: pointer; transition: color 0.2s ease, background 0.2s ease;
            border-radius: 4px; padding: 1px 3px; margin-left: -3px;
        }
        .topic-card .item-en:hover { color: var(--primary); background: rgba(0, 212, 255, 0.06); }
        .topic-card .item-en.speaking { color: var(--primary); background: rgba(0, 212, 255, 0.12); }
        .topic-card .item-ar { color: var(--muted); font-size: 0.82rem; line-height: 1.6; text-align: right; direction: rtl; display: none; margin-top: 2px; padding-right: 8px; border-right: 2px solid rgba(0, 212, 255, 0.2); }
        .topic-card .item-ar.show { display: block; }
        .topic-card .card-items.numbered { counter-reset: item-counter; }
        .topic-card .card-items.numbered li { padding-right: 28px; position: relative; counter-increment: item-counter; }
        .topic-card .card-items.numbered li::before { content: counter(item-counter) "-"; position: absolute; right: 2px; color: var(--primary); font-weight: 700; font-size: 0.85rem; }
        .info-table-wrap { overflow-x: auto; margin: 12px 0; border-radius: 10px; border: 1px solid var(--card-border); grid-column: 1 / -1; }
        .info-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 500px; }
        .info-table th { background: var(--table-header-bg); color: var(--primary); padding: 8px 6px; text-align: center; border-bottom: 2px solid var(--primary); font-weight: 700; }
        .info-table td { padding: 8px 6px; border-bottom: 1px solid var(--card-border); vertical-align: top; line-height: 1.5; }
        .info-table tr:last-child td { border-bottom: none; }
        .info-table .ar-text { border-right: none; padding-right: 0; margin-top: 2px; font-size: 0.78rem; display: block; color: var(--muted); }
        .info-table .en-text {
            font-size: 0.85rem; cursor: pointer; transition: color 0.2s ease, background 0.2s ease;
            border-radius: 4px; padding: 1px 3px; margin-left: -3px; display: inline-block;
            text-align: left; direction: ltr;
        }
        .info-table .en-text:hover { color: var(--primary); background: rgba(0, 212, 255, 0.06); }
        .info-table .en-text.speaking { color: var(--primary); background: rgba(0, 212, 255, 0.12); }
        @media (max-width: 600px) { .cards-grid { grid-template-columns: 1fr; } .info-table { font-size: 0.72rem; min-width: 350px; } .topic-card .card-title { font-size: 0.85rem; } }
        .footer-credit { text-align: center; color: rgba(255, 255, 255, 0.12); font-size: 0.7rem; margin-top: 24px; padding: 10px 0; border-top: 1px solid var(--footer-border); }
        [data-theme="light"] .footer-credit { color: rgba(0, 0, 0, 0.2); }
        .footer-credit .name { color: var(--primary); font-weight: 600; }
        @media (max-width: 768px) { body { padding: 8px 4px; } .header h1 { font-size: 1.4rem; } .tab-btn { padding: 6px 10px; font-size: 0.6rem; } .card { padding: 14px 10px; } .card h2 { font-size: 1.1rem; } }
        .topic-card.full-width { grid-column: 1 / -1; }

        /* PDF BUTTON */
        .pdf-btn {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--danger);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }
        .pdf-btn:hover {
            background: rgba(248, 113, 113, 0.2);
            border-color: var(--danger);
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="header-top">
                <div>
                    <h1><span class="highlight">Health Education</span></h1>
                    <div class="sub"></div>
                    <div class="creator">Created by <span class="name">MR. YASSIN THARWAT</span></div>
                </div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="تبديل الوضع">☀</button>
            </div>
        </div>
        <div class="tabs-wrap" id="tabsContainer"></div>
        <div id="sectionsContainer"></div>
        <div class="footer-credit">Created by <span class="name">MR. YASSIN THARWAT</span></div>
    </div>

    <script>
        let currentTheme = localStorage.getItem('theme') || 'dark';
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeToggle').textContent = theme === 'light' ? '☾' : '☀';
            localStorage.setItem('theme', theme);
            currentTheme = theme;
        }
        function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

        let slideState = {};
        function initSlideState(partId, totalSlides) { slideState[partId] = { current: 0, total: totalSlides }; }
        function renderSlide(partId, containerId) {
            const state = slideState[partId];
            if (!state) return;
            const container = document.getElementById(containerId);
            if (!container) return;
            const slides = container.querySelectorAll('.slide');
            slides.forEach((s, i) => s.classList.toggle('active', i === state.current));
            const progressBar = container.querySelector('.slide-progress .fill');
            const countSpan = container.querySelector('.slide-progress .count');
            if (progressBar) progressBar.style.width = ((state.current + 1) / state.total * 100) + '%';
            if (countSpan) countSpan.textContent = `${state.current + 1} / ${state.total}`;
            const prevBtn = container.querySelector('.btn-nav.prev');
            const nextBtn = container.querySelector('.btn-nav.next');
            if (prevBtn) prevBtn.disabled = state.current === 0;
            if (nextBtn) nextBtn.disabled = state.current === state.total - 1;
        }
        function goToSlide(partId, containerId, index) {
            const state = slideState[partId];
            if (!state) return;
            if (index < 0) index = 0;
            if (index >= state.total) index = state.total - 1;
            state.current = index;
            renderSlide(partId, containerId);
        }

        function stripHTML(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        function createSlideHTML(title, cardsHTML) {
            return `<div class="slide"><h3 style="font-size:1.1rem; color:var(--primary); margin-bottom:12px; border-right:3px solid var(--primary); padding-right:10px;">${title}</h3><div class="cards-grid">${cardsHTML}</div></div>`;
        }

        function card(title, items, arTitle = '') {
            const cardId = 'c' + Math.random().toString(36).substr(2, 8);
            const itemsHTML = items.map((item) => {
                const en = item.en || item;
                const ar = item.ar || '';
                return `<li><span class="item-en" data-text="${stripHTML(en).replace(/"/g, '&quot;')}">${en}</span><span class="item-ar">${ar}</span></li>`;
            }).join('');
            const listClass = items.some(i => i.en && i.en.match(/^\d/)) ? 'card-items numbered' : 'card-items simple';
            return `<div class="topic-card" data-card="${cardId}"><div class="card-header"><span class="card-title"><span class="card-title-en">${title}</span><span class="card-title-ar" id="${cardId}-title-ar">${arTitle}</span></span><button class="translate-btn" data-card="${cardId}" onclick="toggleCardTranslation('${cardId}')">ترجمة</button></div><ul class="${listClass}">${itemsHTML}</ul></div>`;
        }

        function tableCard(title, tableHTML, arTitle = '') {
            return `<div class="topic-card full-width"><div class="card-header"><span class="card-title"><span class="card-title-en">${title}</span><span class="card-title-ar" style="display:block;">${arTitle}</span></span></div><div class="info-table-wrap">${tableHTML}</div></div>`;
        }

        function cell(en, ar) {
            return `<span class="en-text" data-text="${stripHTML(en).replace(/"/g, '&quot;')}">${en}</span><span class="ar-text">${ar}</span>`;
        }

        function toggleCardTranslation(cardId) {
            const card = document.querySelector(`.topic-card[data-card="${cardId}"]`);
            if (!card) return;
            const arItems = card.querySelectorAll('.item-ar');
            const titleAr = document.getElementById(`${cardId}-title-ar`);
            const titleEn = card.querySelector('.card-title-en');
            const btn = card.querySelector('.translate-btn');
            const isVisible = arItems.length > 0 && arItems[0].classList.contains('show');
            arItems.forEach(el => el.classList.toggle('show'));
            if (titleAr) { titleAr.classList.toggle('show'); if (titleEn) titleEn.classList.toggle('hidden'); }
            if (btn) { btn.textContent = isVisible ? 'ترجمة' : 'إخفاء'; btn.classList.toggle('active'); }
        }

        /* ============================================================
           TTS - النطق بالضغط على النص الإنجليزي
        ============================================================ */
        function initTTS() {
            if (!window.speechSynthesis) return;
            if (window.speechSynthesis.getVoices().length === 0) {
                window.speechSynthesis.onvoiceschanged = function() {};
            }
            document.addEventListener('click', function(e) {
                const target = e.target.closest('.item-en, .en-text');
                if (!target) return;
                if (e.target.closest('.translate-btn')) return;
                const text = (target.getAttribute('data-text') || target.textContent || '').trim();
                if (!text) return;
                speakText(text, target);
            });
        }

        function speakText(text, element) {
            const synth = window.speechSynthesis;
            if (!synth) return;
            synth.cancel();
            document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            const voices = synth.getVoices();
            const englishVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google'))
                || voices.find(v => v.lang.startsWith('en-US'))
                || voices.find(v => v.lang.startsWith('en'));
            if (englishVoice) utterance.voice = englishVoice;
            utterance.onstart = () => { if (element) element.classList.add('speaking'); };
            utterance.onend = () => { if (element) element.classList.remove('speaking'); };
            utterance.onerror = () => { if (element) element.classList.remove('speaking'); };
            synth.speak(utterance);
        }

        /* ============================================================
           PDF DOWNLOAD — FINAL FIX: single-column flow, no forced breaks
        ============================================================ */
        function downloadPDF(sectionId) {
            const sec = slidesData[sectionId];
            if (!sec) return;

            let allSlidesHTML = '';
            sec.slides.forEach((slide) => {
                let cardsHTML = '';
                if (slide.cards) {
                    slide.cards.forEach(c => { cardsHTML += c; });
                }
                allSlidesHTML += `
                    <div class="pdf-slide">
                        <div class="pdf-slide-header">
                            <h2>${slide.title}</h2>
                        </div>
                        <div class="pdf-cards">${cardsHTML}</div>
                    </div>
                `;
            });

            const printWindow = window.open('', '_blank');
            if (!printWindow) {
                alert('يرجى السماح بالنوافذ المنبثقة لتحميل PDF');
                return;
            }

            printWindow.document.write(`
                <!DOCTYPE html>
                <html lang="ar" dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <title>Health Education</title>
                    <style>
                        @page { margin: 12mm 10mm; size: A4; }
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                        html, body {
                            -webkit-print-color-adjust: exact;
                            print-color-adjust: exact;
                        }
                        body {
                            font-family: 'Segoe UI', Tahoma, sans-serif;
                            font-size: 13px;
                            color: #111;
                            line-height: 1.55;
                            orphans: 2;
                            widows: 2;
                        }
                        .pdf-subject-header {
                            text-align: center;
                            border-bottom: 3px solid #0099cc;
                            padding-bottom: 8px;
                            margin-bottom: 14px;
                        }
                        .pdf-subject-header h1 {
                            font-size: 26px;
                            color: #0099cc;
                            font-weight: 800;
                            letter-spacing: 2px;
                        }
                        .pdf-subject-header .creator {
                            font-size: 12px;
                            color: #666;
                            margin-top: 3px;
                        }
                        .pdf-slide {
                            margin-bottom: 14px;
                            padding: 0;
                            page-break-inside: auto;
                            break-inside: auto;
                        }
                        .pdf-slide-header {
                            margin-bottom: 8px;
                            padding-bottom: 5px;
                            border-bottom: 2.5px solid #0099cc;
                            page-break-after: avoid;
                            break-after: avoid;
                        }
                        .pdf-slide-header h2 {
                            font-size: 16px;
                            color: #0077aa;
                            font-weight: 700;
                            line-height: 1.35;
                        }
                        .pdf-cards {
                            display: block;
                        }
                        .pdf-cards .topic-card {
                            display: block;
                            border: 1.5px solid #e0e0e0;
                            border-radius: 6px;
                            padding: 8px 10px;
                            background: #ffffff;
                            margin-bottom: 8px;
                            page-break-inside: auto;
                            break-inside: auto;
                        }
                        .pdf-cards .card-header {
                            border-bottom: 2px solid #0099cc;
                            padding-bottom: 4px;
                            margin-bottom: 6px;
                            page-break-after: avoid;
                            break-after: avoid;
                        }
                        .pdf-cards .card-title {
                            font-size: 13.5px;
                            font-weight: 700;
                            color: #0077aa;
                            line-height: 1.35;
                        }
                        .pdf-cards .card-title-ar {
                            font-size: 12px;
                            color: #555;
                            font-weight: 400;
                            display: block;
                            margin-top: 2px;
                        }
                        .pdf-cards .card-title-en { display: block; }
                        .pdf-cards .translate-btn { display: none; }
                        .pdf-cards ul { list-style: none; padding: 0; margin: 0; }
                        .pdf-cards li {
                            padding: 4px 0;
                            border-bottom: 1px dotted #e5e5e5;
                            font-size: 12.5px;
                            line-height: 1.5;
                            page-break-inside: avoid;
                            break-inside: avoid;
                        }
                        .pdf-cards li:last-child { border-bottom: none; }
                        .pdf-cards .item-en {
                            font-weight: 600;
                            display: block;
                            text-align: left;
                            direction: ltr;
                            font-size: 12.5px;
                            color: #111;
                        }
                        .pdf-cards .item-ar {
                            display: block;
                            color: #555;
                            font-size: 12px;
                            text-align: right;
                            direction: rtl;

                            { en: '5. <span class="highlight-text">Does not consider determinants of health</span>.', ar: '5. <span class="highlight-text">لا يعتبر محددات الصحة</span>.' }
                        ], 'خصائص النموذج:')
                    ]
                },
                {
                    title: '2. Self-Empowerment Model · نموذج التمكين الذاتي',
                    cards: [
                        card('Self-Empowerment Model · نموذج التمكين الذاتي', [
                            { en: 'This approach (also known as the <span class="highlight-text">self-actualization model</span>) seeks to develop the individual\'s ability to control their own health status as far as possible within their environment.', ar: 'هذا النهج (المعروف أيضاً بـ<span class="highlight-text">نموذج تحقيق الذات</span>) يسعى إلى تطوير قدرة الفرد على التحكم في حالته الصحية قدر الإمكان ضمن بيئته.' }
                        ], 'نموذج التمكين الذاتي:'),
                        card('Characteristics of Self-Empowerment Model · خصائص نموذج التمكين الذاتي', [
                            { en: '1. Develops a <span class="highlight-text">sense of identity</span>.', ar: '1. يطور <span class="highlight-text">إحساساً بالهوية</span>.' },
                            { en: '2. <span class="highlight-text">Clarifies values</span>.', ar: '2. <span class="highlight-text">يوضح القيم</span>.' },
                            { en: '3. Enhances <span class="highlight-text">self-awareness</span>.', ar: '3. يعزز <span class="highlight-text">الوعي الذاتي</span>.' },
                            { en: '4. Focuses on the <span class="highlight-text">individual</span>.', ar: '4. يركز على <span class="highlight-text">الفرد</span>.' },
                            { en: '5. Encourages people to <span class="highlight-text">reflect and change their views</span>.', ar: '5. يشجع الناس على <span class="highlight-text">التأمل وتغيير آرائهم</span>.' },
                            { en: '6. Enhances <span class="highlight-text">self-esteem</span>.', ar: '6. يعزز <span class="highlight-text">احترام الذات</span>.' },
                            { en: '7. Enhances <span class="highlight-text">self-responsibility</span>.', ar: '7. يعزز <span class="highlight-text">المسؤولية الذاتية</span>.' },
                            { en: '8. Enhances <span class="highlight-text">self-confidence</span>.', ar: '8. يعزز <span class="highlight-text">الثقة بالنفس</span>.' },
                            { en: '9. <span class="highlight-text">Integrity</span>.', ar: '9. <span class="highlight-text">النزاهة</span>.' },
                            { en: '10. <span class="highlight-text">Assertiveness</span>.', ar: '10. <span class="highlight-text">الحزم</span>.' }
                        ], 'خصائص النموذج:')
                    ]
                },
                {
                    title: '3. Collective Action Model · نموذج العمل الجماعي',
                    cards: [
                        card('Collective Action Model · نموذج العمل الجماعي', [
                            { en: 'This is a <span class="highlight-text">socio-ecological approach</span> that takes account of the interrelationship between the individual and the environment.', ar: 'هذا <span class="highlight-text">نهج اجتماعي-بيئي</span> يأخذ في الاعتبار العلاقة المتبادلة بين الفرد والبيئة.' },
                            { en: 'It is based on the view that health is determined by factors that operate <span class="highlight-text">outside the control of individuals</span>.', ar: 'يستند إلى الرأي القائل بأن الصحة تحددها عوامل تعمل <span class="highlight-text">خارج سيطرة الأفراد</span>.' }
                        ], 'نموذج العمل الجماعي:'),
                        card('Characteristics of Collective Action Model · خصائص نموذج العمل الجماعي', [
                            { en: '1. Encourages <span class="highlight-text">democratic processes and participation</span> \'by all for all\'.', ar: '1. يشجع <span class="highlight-text">العمليات الديمقراطية والمشاركة</span> \'من الجميع للجميع\'.' },
                            { en: '2. Takes <span class="highlight-text">determinants of health</span> into consideration.', ar: '2. يأخذ <span class="highlight-text">محددات الصحة</span> في الاعتبار.' },
                            { en: '3. Emphasizes <span class="highlight-text">empowerments for all participants</span>.', ar: '3. يؤكد على <span class="highlight-text">التمكين لجميع المشاركين</span>.' },
                            { en: '4. Is based on <span class="highlight-text">authentic needs</span>.', ar: '4. يستند إلى <span class="highlight-text">احتياجات حقيقية</span>.' },
                            { en: '5. Uses <span class="highlight-text">critical thinking and critical action</span> in relation to the individual, others, and society.', ar: '5. يستخدم <span class="highlight-text">التفكير النقدي والعمل النقدي</span> فيما يتعلق بالفرد والآخرين والمجتمع.' }
                        ], 'خصائص النموذج:')
                    ]
                },
                {
                    title: '4. The Medical Model · النموذج الطبي',
                    cards: [
                        card('The Medical Model · النموذج الطبي', [
                            { en: 'Is a <span class="highlight-text">traditional approach</span> that focuses on the diagnosis and treatment of diseases or health conditions.', ar: '<span class="highlight-text">نهج تقليدي</span> يركز على تشخيص وعلاج الأمراض أو الحالات الصحية.' },
                            { en: 'It is based on the belief that health issues can be addressed primarily through <span class="highlight-text">medical interventions</span>, such as medication, surgery, or other medical procedures.', ar: 'يستند إلى الاعتقاد بأن القضايا الصحية يمكن معالجتها في المقام الأول من خلال <span class="highlight-text">التدخلات الطبية</span>، مثل الأدوية أو الجراحة أو الإجراءات الطبية الأخرى.' }
                        ], 'النموذج الطبي:'),
                        card('Characteristics of Medical Model · خصائص النموذج الطبي', [
                            { en: '1. Increase individuals\' <span class="highlight-text">knowledge about specific diseases</span> or conditions and their treatment options.', ar: '1. زيادة <span class="highlight-text">معرفة الأفراد بأمراض محددة</span> أو حالات وخيارات علاجها.' },
                            { en: '2. Providing information on <span class="highlight-text">symptoms, causes, and available medical treatments</span>.', ar: '2. تقديم معلومات عن <span class="highlight-text">الأعراض والأسباب والعلاجات الطبية المتاحة</span>.' },
                            { en: '3. Focus on <span class="highlight-text">preventing or managing diseases</span> through medical interventions and adherence to prescribed treatments.', ar: '3. التركيز على <span class="highlight-text">الوقاية من الأمراض أو إدارتها</span> من خلال التدخلات الطبية والالتزام بالعلاجات الموصوفة.' }
                        ], 'خصائص النموذج:'),
                        card('Limitations of Medical Model · قيود النموذج الطبي', [
                            { en: '1. <span class="highlight-text">View health as the absence of disease</span> and the broader social, environmental, and behavioral factors that influence health.', ar: '1. <span class="highlight-text">ينظر إلى الصحة على أنها غياب المرض</span> والعوامل الاجتماعية والبيئية والسلوكية الأوسع التي تؤثر على الصحة.' },
                            { en: '2. <span class="highlight-text">Not fully consider</span> the importance of preventive measures, health promotion, and lifestyle changes in maintaining overall well-being.', ar: '2. <span class="highlight-text">لا يعتبر بشكل كامل</span> أهمية التدابير الوقائية وتعزيز الصحة وتغييرات نمط الحياة في الحفاظ على الرفاهية العامة.' }
                        ], 'قيود النموذج:')
                    ]
                },
                {
                    title: '5. The Motivational Model · النموذج التحفيزي',
                    cards: [
                        card('The Motivational Model · النموذج التحفيزي', [
                            { en: 'Is an approach that focuses on understanding and enhancing individuals\' <span class="highlight-text">motivation to engage in health-promoting behaviors</span>.', ar: 'نهج يركز على فهم وتعزيز <span class="highlight-text">دافعية الأفراد للانخراط في السلوكيات المعززة للصحة</span>.' },
                            { en: 'This model recognizes that <span class="highlight-text">motivation plays a crucial role</span> in determining whether individuals adopt and maintain healthy behaviors.', ar: 'يدرك هذا النموذج أن <span class="highlight-text">الدافعية تلعب دوراً حاسماً</span> في تحديد ما إذا كان الأفراد يتبنون ويحافظون على السلوكيات الصحية.' }
                        ], 'النموذج التحفيزي:'),
                        card('Characteristics of Motivational Model · خصائص النموذج التحفيزي', [
                            { en: '<span class="highlight-text">Self-efficacy</span>.', ar: '<span class="highlight-text">الكفاءة الذاتية</span>.' },
                            { en: '<span class="highlight-text">Processes of change</span>.', ar: '<span class="highlight-text">عمليات التغيير</span>.' },
                            { en: '<span class="highlight-text">Continuous process</span>.', ar: '<span class="highlight-text">عملية مستمرة</span>.' },
                            { en: '<span class="highlight-text">Relapse and recycle</span>.', ar: '<span class="highlight-text">الانتكاس وإعادة التدوير</span>.' }
                        ], 'خصائص النموذج:')
                    ]
                },
                {
                    title: '6. The Social Model · النموذج الاجتماعي',
                    cards: [
                        card('The Social Model · النموذج الاجتماعي', [
                            { en: 'Is an approach that emphasizes the influence of <span class="highlight-text">social factors on individuals\' health behaviors and outcomes</span>.', ar: 'نهج يؤكد على تأثير <span class="highlight-text">العوامل الاجتماعية على السلوكيات والنتائج الصحية للأفراد</span>.' },
                            { en: 'This model recognizes that health is <span class="highlight-text">not determined by individual choices and behaviors</span> but is shaped by broader social, economic, and environmental factors.', ar: 'يدرك هذا النموذج أن الصحة <span class="highlight-text">لا تحددها الخيارات والسلوكيات الفردية</span> بل تشكلها عوامل اجتماعية واقتصادية وبيئية أوسع.' }
                        ], 'النموذج الاجتماعي:'),
                        card('Principles of Social Model (1) · مبادئ النموذج الاجتماعي (1)', [
                            { en: '1. <span class="highlight-text">Empowerment and participation</span>: Give people the knowledge and skills needed to allow them to participate in the decisions that positively impact their health.', ar: '1. <span class="highlight-text">التمكين والمشاركة</span>: منح الناس المعرفة والمهارات اللازمة للسماح لهم بالمشاركة في القرارات التي تؤثر بشكل إيجابي على صحتهم.' },
                            { en: '2. <span class="highlight-text">Health promotion and prevention</span>: Health promotion and illness prevention programs help people make beneficial choices to reduce the risk of disease and disabilities which both enhances the quality of life and reduces premature deaths.', ar: '2. <span class="highlight-text">تعزيز الصحة والوقاية</span>: تساعد برامج تعزيز الصحة والوقاية من الأمراض الناس على اتخاذ خيارات مفيدة لتقليل خطر المرض والإعاقات مما يعزز جودة الحياة ويقلل من الوفيات المبكرة.' }
                        ], 'مبادئ النموذج (1):'),
                        card('Principles of Social Model (2) · مبادئ النموذج الاجتماعي (2)', [
                            { en: '3. <span class="highlight-text">Interdisciplinary collaboration</span>: Many groups (government, health, private sectors) need to work together towards a common goal.', ar: '3. <span class="highlight-text">التعاون بين التخصصات</span>: تحتاج العديد من المجموعات (الحكومة، الصحة، القطاع الخاص) إلى العمل معاً نحو هدف مشترك.' },
                            { en: '4. <span class="highlight-text">Advocacy and policy change</span>: Educating the public; providing information and resources to individuals in need of help and helping individuals get benefits or services to which they are entitled.', ar: '4. <span class="highlight-text">المناصرة وتغيير السياسات</span>: تثقيف الجمهور؛ توفير المعلومات والموارد للأفراد المحتاجين للمساعدة ومساعدة الأفراد في الحصول على المزايا أو الخدمات التي يحق لهم الحصول عليها.' }
                        ], 'مبادئ النموذج (2):')
                    ]
                },
                {
                    title: '7. The Health Belief Model · نموذج المعتقد الصحي',
                    cards: [
                        card('The Health Belief Model · نموذج المعتقد الصحي', [
                            { en: 'Is a <span class="highlight-text">psychological model</span> that seeks to explain and predict individuals\' health behaviors based on their beliefs and perceptions.', ar: '<span class="highlight-text">نموذج نفسي</span> يسعى إلى شرح والتنبؤ بالسلوكيات الصحية للأفراد بناءً على معتقداتهم وتصوراتهم.' },
                            { en: 'It was developed in the <span class="highlight-text">1950s</span> and has been widely used in health education and promotion.', ar: 'تم تطويره في <span class="highlight-text">الخمسينيات</span> واستخدم على نطاق واسع في التثقيف الصحي وتعزيز الصحة.' }
                        ], 'نموذج المعتقد الصحي:')
                    ]
                },
                {
                    title: 'Ottawa Charter Strategies · استراتيجيات ميثاق أوتاوا',
                    cards: [
                        card('Ottawa Charter · ميثاق أوتاوا', [
                            { en: 'Ottawa charter determined that <span class="highlight-text">five key strategies</span> needed to enhance public health in relation to health promotion.', ar: 'حدد ميثاق أوتاوا <span class="highlight-text">خمس استراتيجيات رئيسية</span> مطلوبة لتعزيز الصحة العامة فيما يتعلق بتعزيز الصحة.' }
                        ], 'ميثاق أوتاوا:'),
                        card('1. Creation of Supportive Environments · خلق بيئات داعمة', [
                            { en: 'Increases an individuals\' ability to make <span class="highlight-text">health promoting choices</span> in their social and physical environments.', ar: 'يزيد قدرة الفرد على اتخاذ <span class="highlight-text">خيارات معززة للصحة</span> في بيئته الاجتماعية والجسدية.' }
                        ], '1. بيئات داعمة:'),
                        card('2. Development of Personal Skills · تطوير المهارات الشخصية', [
                            { en: 'Enables people to <span class="highlight-text">enhance their health knowledge</span> through the provision of information and skills.', ar: 'يمكن الناس من <span class="highlight-text">تعزيز معرفتهم الصحية</span> من خلال توفير المعلومات والمهارات.' },
                            { en: 'For instance, a mother who is educated about the importance of a well-balanced diet will provide healthy foods for her children and pass on her knowledge.', ar: 'على سبيل المثال، الأم التي تتعلم أهمية النظام الغذائي المتوازن ستوفر الأطعمة الصحية لأطفالها وتنقل معرفتها.' }
                        ], '2. المهارات الشخصية:'),
                        card('3. Strengthening of Community Action · تعزيز العمل المجتمعي', [
                            { en: 'Involves <span class="highlight-text">empowering communities</span> to identify and implement actions to address health concerns.', ar: 'يشمل <span class="highlight-text">تمكين المجتمعات</span> لتحديد وتنفيذ إجراءات لمعالجة المخاوف الصحية.' }
                        ], '3. العمل المجتمعي:'),
                        card('4. Building of Healthy Public Policies · بناء سياسات عامة صحية', [
                            { en: 'Involves the decisions made by government and organizations that work towards <span class="highlight-text">health improvements</span>.', ar: 'يشمل القرارات التي تتخذها الحكومة والمنظمات التي تعمل نحو <span class="highlight-text">تحسين الصحة</span>.' }
                        ], '4. السياسات العامة:'),
                        card('5. Reorientation of Health Services · إعادة توجيه الخدمات الصحية', [
                            { en: 'Involves <span class="highlight-text">moving away from traditional</span> approaches to healthcare delivery.', ar: 'يشمل <span class="highlight-text">الابتعاد عن المناهج التقليدية</span> لتقديم الرعاية الصحية.' }
                        ], '5. الخدمات الصحية:')
                    ]
                }
            ]
        };

        const slidesData = { healthEd: healthEdData, principles: principlesData, models: modelsData };
        const sectionOrder = ['healthEd', 'principles', 'models'];

        function renderSlideContent(slide) {
            if (slide.cards && Array.isArray(slide.cards)) {
                return createSlideHTML(slide.title, slide.cards.join(''));
            }
            return createSlideHTML(slide.title, '');
        }

        function switchSection(secId) {
            document.querySelectorAll('.tab-btn').forEach(t => {
                t.classList.toggle('active', t.dataset.section === secId);
            });
            document.querySelectorAll('.card').forEach(c => {
                c.classList.toggle('active', c.id === `section-${secId}`);
            });
        }

        function buildApp() {
            const tabsContainer = document.getElementById('tabsContainer');
            const sectionsContainer = document.getElementById('sectionsContainer');
            sectionOrder.forEach((secId, index) => {
                const sec = slidesData[secId];
                if (!sec) return;

                const tab = document.createElement('button');
                tab.className = 'tab-btn' + (index === 0 ? ' active' : '');
                tab.innerHTML = `<span class="en">${sec.titleEn}</span><span class="ar">${sec.titleAr}</span>`;
                tab.dataset.section = secId;
                tab.addEventListener('click', () => switchSection(secId));
                tabsContainer.appendChild(tab);

                const cardEl = document.createElement('div');
                cardEl.className = 'card' + (index === 0 ? ' active' : '');
                cardEl.id = `section-${secId}`;
                const slidesHTML = sec.slides.map(s => renderSlideContent(s)).join('');
                const totalSlides = sec.slides.length;
                cardEl.innerHTML = `
                    <h2>${sec.titleEn} · ${sec.titleAr}</h2>
                    <div style="text-align:center; margin-bottom:12px;">
                        <button class="pdf-btn" onclick="downloadPDF('${secId}')">📄 تحميل المحاضرة PDF</button>
                    </div>
                    <div class="slide-container" id="slideContainer-${secId}">
                        <div class="slide-progress">
                            <span style="font-weight:600;">التقدم</span>
                            <div class="bar"><div class="fill" style="width:0%;"></div></div>
                            <span class="count">1 / ${totalSlides}</span>
                        </div>
                        ${slidesHTML}
                        <div class="slide-nav">
                            <button class="btn-nav prev" onclick="goToSlide('${secId}', 'slideContainer-${secId}', slideState['${secId}'].current - 1)">السابق</button>
                            <button class="btn-nav next primary" onclick="goToSlide('${secId}', 'slideContainer-${secId}', slideState['${secId}'].current + 1)">التالي</button>
                        </div>
                    </div>`;
                sectionsContainer.appendChild(cardEl);

                initSlideState(secId, totalSlides);
                setTimeout(() => renderSlide(secId, `slideContainer-${secId}`), 50);
            });

            setTimeout(() => initTTS(), 200);
        }

        applyTheme(localStorage.getItem('theme') || 'dark');
        buildApp();

        window.goToSlide = goToSlide;
        window.slideState = slideState;
        window.toggleTheme = toggleTheme;
        window.toggleCardTranslation = toggleCardTranslation;
        window.switchSection = switchSection;
        window.downloadPDF = downloadPDF;
    </script>
</body>
</html>
